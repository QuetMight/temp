schema_version = "1.4"

# ═════════════════════════════════════════════════════════════════════════════
# datacom —— 三步任务骨架
#
#   new_spec   → 产出规格说明 /app/spec.md          （verify 置空）
#   new_plan   → 产出实现计划 /app/plan.md          （verify 置空）
#   implement  → 按计划实现                         （唯一的真实验证步骤）
#
# 关键设计：
#   * multi_step_reward_strategy = "final"
#       试炼级 reward 只取**最后一个执行过的 step** 的 verifier 结果，
#       因此前两步那个恒为 1.0 的占位 verifier 不会稀释分数。
#   * 前两步 environment_mode = "shared"
#       占位 verifier 直接跑在 agent 容器里，不额外起容器、不额外计费。
#   * 第三步 environment_mode = "separate" + steps/implement/tests/Dockerfile
#       自定义 verifier 在独立容器里跑；判分流程由 /tests/verify.py 管理
#       （构建 / 测试 / LLM 打分 / 执行过程分析）。
#
# 注意：Harbor **没有** per-step 关闭验证的字段（VerifierConfig.disable 只在
# trial 级运行配置里）。所以"中间步骤 verify 置空"是通过给它们一个什么都不做、
# 只写恒定 reward 的 tests/test.sh 实现的。
# ═════════════════════════════════════════════════════════════════════════════

multi_step_reward_strategy = "final"

[task]
name = "harbor/datacom"
version = "0.1.0"
description = "三步 datacom 任务骨架：先写规格、再写计划、最后实现；仅在最后一步用独立 verifier 打分。"
authors = []
keywords = ["datacom", "multi-step", "separate-verifier", "skeleton"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["datacom", "multi-step", "separate-verifier", "skeleton"]

# ─────────────────────────────────────────────────────────────────────────────
# agent 环境：三个 step 共享同一个容器，文件系统跨步持久
# ─────────────────────────────────────────────────────────────────────────────
[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

[environment.env]

# ─────────────────────────────────────────────────────────────────────────────
# 默认 agent / verifier 配置（各 step 未显式覆盖时继承）
# ─────────────────────────────────────────────────────────────────────────────
[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 300.0

[solution.env]

# ═════════════════════════════════════════════════════════════════════════════
# Step 1 / new_spec —— 写规格；不做实质校验
# ═════════════════════════════════════════════════════════════════════════════
[[steps]]
name = "new_spec"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
# 显式 shared：不额外起容器。tests/test.sh 是空占位，只写 reward = 1.0。
environment_mode = "shared"
timeout_sec = 60.0

# ═════════════════════════════════════════════════════════════════════════════
# Step 2 / new_plan —— 写实现计划；不做实质校验
# ═════════════════════════════════════════════════════════════════════════════
[[steps]]
name = "new_plan"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
environment_mode = "shared"
timeout_sec = 60.0

# ═════════════════════════════════════════════════════════════════════════════
# Step 3 / implement —— 实现；唯一的真实验证步骤
# ═════════════════════════════════════════════════════════════════════════════
[[steps]]
name = "implement"

# 仅在最后一步收集交付物。separate verifier 拿不到 agent 的文件系统，
# 能进 verifier 容器的只有下面这些条目（回到它们的原始 source 路径）
# 加上隐式注入的发布目录 /logs/artifacts/。
artifacts = [
    "/app/spec.md",
    "/app/plan.md",
    "/logs/agent/trajectory.json",
]

[steps.agent]
timeout_sec = 3600.0

[steps.verifier]
timeout_sec = 3600.0
environment_mode = "separate"

# 独立 verifier 环境。
# 这里**故意不写 docker_image**，让 steps/implement/tests/Dockerfile 成为
# verifier 镜像（Harbor 的镜像优先级：本 step 的 docker_image > 本 step 的
# tests/Dockerfile > task 级 verifier 镜像 > task 级 tests/Dockerfile >
# 回退到 agent 环境）。命中前 4 项时 Harbor 不再上传 tests/，镜像必须自带
# /tests/test.sh。
[steps.verifier.environment]
network_mode = "public"      # LLM 打分需要出网
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[steps.verifier.environment.env]

# ─────────────────────────────────────────────────────────────────────────────
# 传给 verify.py 的环境变量。
#
# 需要用 LLM 打分时取消注释。${...} 在**宿主机**上解析；注意没有 :- 默认值的
# ${VAR} 在宿主缺变量时会直接抛错，所以这里默认整段注释掉，保证骨架开箱可跑。
# ─────────────────────────────────────────────────────────────────────────────
# [steps.verifier.env]
# DATACOM_JUDGE_API_KEY = "${DATACOM_JUDGE_API_KEY}"
# DATACOM_JUDGE_MODEL = "openai/gpt-5.6-sol"
# DATACOM_WORKSPACE = "/app"
# DATACOM_TRAJECTORY_PATH = "/logs/agent/trajectory.json"
